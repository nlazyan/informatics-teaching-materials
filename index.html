<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Թվային Անվտանգության Վիկտորինա</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Noto Sans Armenian', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 650px;
            width: 100%;
            padding: 30px;
            box-sizing: border-box;
        }

        .header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin: 0 0 10px 0;
        }

        .progress-bar {
            background-color: var(--border);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            background-color: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-box {
            display: none;
        }

        .question-box.active {
            display: block;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            background-color: var(--bg-color);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 14px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .option-item:hover {
            border-color: var(--primary);
            background-color: rgba(37, 99, 235, 0.03);
        }

        .option-item.correct {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: #065f46;
        }

        .option-item.wrong {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
            color: #991b1b;
        }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            display: none;
        }

        .feedback.correct-msg {
            display: block;
            background-color: #ecfdf5;
            color: #047857;
            border-left: 4px solid var(--success);
        }

        .feedback.wrong-msg {
            display: block;
            background-color: #fef2f2;
            color: #b91c1c;
            border-left: 4px solid var(--danger);
        }

        .nav-buttons {
            display: flex;
            justify-content: flex-end;
            margin-top: 25px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--border);
            color: var(--muted);
            cursor: not-allowed;
        }

        .result-screen {
            display: none;
            text-align: center;
        }

        .result-screen.active {
            display: block;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 6px solid var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            margin: 20px auto;
        }

        .badge-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-flow">
        <div class="header">
            <h1 id="quiz-title">Էլեկտրոնային ապահովություն • Վիկտորինա</h1>
            <div id="q-counter" style="font-size: 0.9rem; color: var(--muted); margin-bottom: 8px;">Հարց 1 / 10</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
        </div>

        <div id="question-container">
            <!-- Questions dynamically generated here -->
        </div>

        <div class="nav-buttons">
            <button id="next-btn" onclick="nextQuestion()" disabled>Հաջորդը ➔</button>
        </div>
    </div>

    <div id="result-container" class="result-screen">
        <h2>Վիկտորինայի Ավարտ</h2>
        <p>Ձեր արդյունքը՝</p>
        <div class="score-circle" id="score-display">0/10</div>
        <div class="badge-text" id="badge-display"></div>
        <button onclick="restartQuiz()">Փորձել նորից</button>
    </div>
</div>

                "Ողջույն ➔ Բովանդակություն ➔ Ավարտ",
                "Բովանդակություն ➔ Ստորագրություն",
                "Թեմա ➔ Ողջույն ➔ Բովանդակություն ➔ Ավարտ/ստորագրություն"
            ],
            correct: 2,
            feedbackCorrect: "Ճիշտ է։ Պատշաճ նամակը պետք է միշտ ունենա հստակ Թեմա (Subject), Ողջույն, կառուցվածքային Բովանդակություն և Ավարտ/ստորագրություն։",
            feedbackWrong: "Ոչ, դա թերի է։ Էլեկտրոնային նամակի ճիշտ և պաշտոնական կառուցվածքը ներառում է՝ Թեմա, Ողջույն, Բովանդակություն և Ստորագրություն։"
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionContainer = document.getElementById('question-container');
    const qCounter = document.getElementById('q-counter');
    const progress = document.getElementById('progress');
    const nextBtn = document.getElementById('next-btn');
    const quizFlow = document.getElementById('quiz-flow');
    const resultContainer = document.getElementById('result-container');
    const scoreDisplay = document.getElementById('score-display');
    const badgeDisplay = document.getElementById('badge-display');

    function initQuiz() {
        currentQuestion = 0;
        score = 0;
        answered = false;
        resultContainer.classList.remove('active');
        quizFlow.style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        nextBtn.disabled = true;
        
        // Update headers
        qCounter.innerText = `Հարց ${currentQuestion + 1} / ${quizData.length}`;
        const progressPercent = ((currentQuestion) / quizData.length) * 100;
        progress.style.width = `${progressPercent}%`;

        const currentData = quizData[currentQuestion];
        
        let optionsHTML = '';
        currentData.options.forEach((option, idx) => {
            optionsHTML += `<li class="option-item" onclick="selectOption(${idx})" id="option-${idx}">${option}</li>`;
        });

        questionContainer.innerHTML = `
            <div class="question-box active">
                <div class="question-text">${currentData.question}</div>
                <ul class="options-list">
                    ${optionsHTML}
                </ul>
                <div id="feedback-box" class="feedback"></div>
            </div>
        `;
    }

    function selectOption(selectedIdx) {
        if (answered) return; // Prevent clicking multiple times
        answered = true;
        
        const currentData = quizData[currentQuestion];
        const feedbackBox = document.getElementById('feedback-box');
        
        // Disable and highlight choices
        for (let i = 0; i < currentData.options.length; i++) {
            const optionElement = document.getElementById(`option-${i}`);
            if (i === currentData.correct) {
                optionElement.classList.add('correct');
            }
            if (i === selectedIdx && selectedIdx !== currentData.correct) {
                optionElement.classList.add('wrong');
            }
        }

        // Handle score and feedback text
        if (selectedIdx === currentData.correct) {
            score++;
            feedbackBox.innerText = currentData.feedbackCorrect;
            feedbackBox.className = 'feedback correct-msg';
        } else {
            feedbackBox.innerText = currentData.feedbackWrong;
            feedbackBox.className = 'feedback wrong-msg';
        }

        nextBtn.disabled = false;
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        quizFlow.style.display = 'none';
        resultContainer.classList.add('active');
        scoreDisplay.innerText = `${score} / ${quizData.length}`;
        
        const percent = (score / quizData.length) * 100;
        let badge = "";
        if (percent === 100) {
            badge = "🏆 Գերազանց! Դուք թվային անվտանգության իսկական փորձագետ եք:";
        } else if (percent >= 70) {
            badge = "🌟 Շատ լավ է! Դուք գիտեք հիմնական անվտանգության կանոնները:";
        } else {
            badge = "📚 Խորհուրդ է տրվում նորից վերանայել դասի սլայդները:";
        }
        badgeDisplay.innerText = badge;
    }

    function restartQuiz() {
        initQuiz();
    }

    // Start the quiz on load
    initQuiz();
</script>

</body>
</html>
